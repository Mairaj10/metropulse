version: 2

models:
  - name: dim_stops
    description: "One row per GTFS stop with descriptive stop information."

    columns:
      - name: stop_id
        description: "Unique GTFS stop identifier."
        data_tests:
          - not_null
          - unique
  - name: dim_routes
    description: "One row per GTFS route with descriptive route information."
    columns:
      - name: route_id
        description: "Unique GTFS route identifier."
        data_tests:
          - not_null
          - unique
  - name: fct_stop_predictions
    description: "One row per realtime stop prediction captured for a trip and stop."

    columns:
      - name: route_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_routes')
                field: route_id

      - name: stop_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stops')
                field: stop_id
                
      - name: static_trip_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_trips')
                field: trip_id
      - name: predicted_delay_seconds
        description: "Difference in seconds between scheduled and predicted arrival."
  - name: dim_trips
    description: "One row per scheduled GTFS trip."

    columns:
      - name: trip_id
        description: "Unique scheduled GTFS trip identifier."
        data_tests:
          - not_null
          - unique